name: validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
        shell: pwsh

      - name: Lint Python with Ruff
        run: ruff check scripts/ --ignore E501
        continue-on-error: true

      - name: Format Check with Black
        run: black --check scripts/ --diff
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci
        shell: pwsh

      - name: Validate JSON
        run: |
          Get-ChildItem -Recurse -Filter "*.json" -Exclude "node_modules" | ForEach-Object {
            try {
              Get-Content $_.FullName | ConvertFrom-Json -ErrorAction Stop | Out-Null
              Write-Host "✅ $($_.Name)"
            } catch {
              Write-Host "❌ $($_.Name): $_"
              exit 1
            }
          }
        shell: pwsh
