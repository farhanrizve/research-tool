[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-tool"
version = "0.1.0"
description = "A fully programmable, AI-autonomous, human-in-the-loop research platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Farhan Rizve" },
]
keywords = ["research", "ai", "agent", "literature", "academic", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "platformdirs>=4.0.0",
    "litellm>=1.50.0",
    "chromadb>=0.5.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
rag = [
    "sentence-transformers>=3.0.0",
]
pdf = [
    "pymupdf>=1.24.0",
]
latex = [
    "pylatexenc>=2.10",
]
all = [
    "research-tool[mcp,rag,pdf,latex]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
research = "research_tool.cli:app"

[project.urls]
Homepage = "https://github.com/farhanrizve/research-tool"
Repository = "https://github.com/farhanrizve/research-tool"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
