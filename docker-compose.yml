services:
  research-tool:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./projects:/app/projects
      - ./web:/app/web
    environment:
      - RESEARCH_LLM_PROVIDER=openai
      - RESEARCH_LLM_MODEL=gpt-4o-mini
      - RESEARCH_TAVILY_API_KEY=${RESEARCH_TAVILY_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
