# research-tools.yaml — Tool configuration for the Research Platform
#
# Define custom tools that extend the research pipeline.
# Tools can be built-in functions or external Python classes.
#
# Environment variables can be referenced with ${VAR_NAME} syntax.

tools:
  # ── Built-in search tools ─────────────────────────────────
  - name: arxiv_search
    description: Search arXiv for academic papers
    function: search_arxiv

  - name: semantic_scholar_search
    description: Search Semantic Scholar for academic papers
    function: search_semantic_scholar

